services:

  proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./proxy/agent.conf:/etc/squid/conf.d/agent.conf:ro
    networks:
      - sandbox
      - egress

  model-relay:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.35-latest}
    command: envoy -c /etc/envoy/envoy.yaml --log-level ${ENVOY_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:9999:11005"
      - "127.0.0.1:9998:9901"
    extra_hosts: 
      - "host.docker.internal:host-gateway"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    networks: 
      - sandbox
      - egress
  
  # envoy external processor (gRPC) that watches model calls and will extract
  # token counts from streamed JSON responses
  extproc:
    image: ghcr.io/wrossmorrow/flint-pi-extproc:latest
    build:
      context: ./extproc
    networks:
      - sandbox
      - egress
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    environment:
      EXTPROC_USAGE_DB: /data/usage.duckdb
      EXTPROC_MOTHERDUCK_DATABASE: ${EXTPROC_MOTHERDUCK_DATABASE:-local_flint_usage}
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:-}
    volumes:
      - extproc-usage-data:/data
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # token generation, refreshing
  token:
    image: ghcr.io/wrossmorrow/flint-pi-token
    build: 
      context: ./github-app
    env_file: ./.env
    environment:
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:?}
    volumes:
      - gh-token:/tokens
    networks: 
      - egress
    secrets:
      - gh_private_key
    healthcheck:
      test: ["CMD", "test", "-s", "/tokens/token"]
      interval: 2s
      retries: 30

  agent:
    image: ${AGENT_IMAGE:-ghcr.io/wrossmorrow/flint-pi-agent}
    build:
      context: ./
      target: ${AGENT_TARGET:-agent}
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    depends_on:
      proxy:
        condition: service_started
      model-relay:
        condition: service_started
      extproc:
        condition: service_healthy
      token: 
        condition: service_healthy
      web-gateway:
        condition: service_started
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: model-relay,localhost,127.0.0.1,::1
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      no_proxy: model-relay,localhost,127.0.0.1,::1
      GITHUB_APP_USER: ${GITHUB_APP_USER:?}
      GITHUB_APP_USER_ID: ${GITHUB_APP_USER_ID:?}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:?}
      REC_API_KEY: ${REC_API_KEY:?}
      # the pi web interface serves on all interfaces inside the container so the
      # web-gateway (socat forwarder) can reach it over the sandbox network
      PI_WEB_HOST: 0.0.0.0
      PI_WEB_PORT: ${PI_WEB_PORT:-8787}
      # optional S3 session-file upload (no-op when the bucket is unset)
      AWS_S3_BUCKET_NAME: ${WEB_AWS_S3_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${WEB_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${WEB_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${WEB_AWS_REGION:-us-east-1}
      REC_PI_CONFIG: '{"baseUrl":"http://model-relay:11005/v1","contextWindow":${FLINT_CONTEXT_WINDOW:-262144},"maxTokens":${FLINT_MAX_TOKENS:-32768}}'
      PI_CODING_AGENT_DIR: /home/node/.pi
      PI_SKIP_VERSION_CHECK: "1"
      # pass the sandbox egress proxy to the JVM (and thus the gradle wrapper / gradle
      # http client) via system properties; no_proxy for local/internal hosts
      JAVA_TOOL_OPTIONS: >-
        -Dhttp.proxyHost=proxy -Dhttp.proxyPort=3128
        -Dhttps.proxyHost=proxy -Dhttps.proxyPort=3128
        -Dhttp.nonProxyHosts=localhost|127.0.0.1|model-relay
    volumes:
      - gh-token:/tokens:ro
      - pi-state:/home/node/.pi
      - cargo-registry:/usr/local/cargo/registry
    networks: 
      - sandbox
    stdin_open: true
    tty: true
    # the final session-upload close (gzip + put) can outlast docker/compose'
    # default 10s stop_grace_period, which SIGKILLs the container mid-flush
    stop_grace_period: 30s

  # host-facing gateway for the pi web interface: socat TCP forwarder that
  # listens on the host and forwards into the agent's web server. The agent sits
  # on the internal `sandbox` network and cannot publish host ports itself, so
  # the forwarder owns the published port.
  web-gateway:
    image: alpine/socat
    command: tcp-listen:8787,fork,reuseaddr tcp-connect:agent:8787
    networks:
      - sandbox
      - default
    ports:
      - "127.0.0.1:${PI_WEB_PORT:-8787}:8787"
    restart: always

secrets:
  gh_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY}

volumes:
  gh-token:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000,mode=0750"
  pi-state:
  cargo-registry:
  extproc-usage-data:

networks:
  sandbox:
    internal: true
  egress: {}
